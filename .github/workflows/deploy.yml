# Builds the site on every push to main and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://choki-dev.github.io/yangkhil.com/.
# It also rebuilds once a day so new Google reviews appear on the site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # daily at 06:00 Bhutan time

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /yangkhil.com
      # set these under Settings > Secrets and variables > Actions; without them the site uses the reviews in site.ts
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # .nojekyll is added by the action, so Pages serves the _astro folder as is
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy site to GitHub Pages"
